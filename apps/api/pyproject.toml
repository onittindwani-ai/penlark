[project]
name = "penlark"
version = "1.0.2"
description = "Penlark: drafts in a person's own voice, checked against house rules and approved by a second person before anything leaves"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "sendora-core",
  "alembic>=1.14",
  "uvicorn>=0.30",
  "pypdf[crypto]>=7",  # [crypto] pulls cryptography, which pypdf needs to read an AES encrypted PDF
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["psycopg[binary]>=3.2", "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "pyyaml>=6", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penlark"]

[tool.coverage.run]
source = ["src/penlark"]
